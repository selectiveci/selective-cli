version: 2
project_name: selective

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: selective
    main: ./cmd/sel
    binary: sel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # musl static build for Alpine
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

brews:
  - name: selective
    repository:
      owner: selectiveci
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://selective.ci
    description: "Selective CI — AI-first test intelligence CLI"
    license: "MIT"
    install: |
      bin.install "sel"

release:
  github:
    owner: selectiveci
    name: selective-cli
